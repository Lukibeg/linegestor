# Render: um serviço web (Docker) + um banco PostgreSQL gerenciado
services:
  - type: web
    name: gestor
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: gestor-db, property: connectionString }
      - key: SECRETS_MASTER_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
databases:
  - name: gestor-db
    plan: starter
